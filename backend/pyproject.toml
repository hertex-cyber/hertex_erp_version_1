[project]
name = "hertex-erp-backend"
version = "1.0.0"
requires-python = ">=3.10"

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "E501", "UP045"]

[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "basic"
exclude = [".venv", "alembic/versions"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["app/tests"]
