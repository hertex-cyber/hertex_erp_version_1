x-backend-env: &backend-env
  ENVIRONMENT: development
  DATABASE_URL: postgresql+asyncpg://hertex:hertex_dev_password@postgres:5432/hertex_erp
  REDIS_URL: redis://redis:6379/0
  JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-string}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
  SETTINGS_ENCRYPTION_KEY: ${SETTINGS_ENCRYPTION_KEY:-}
  AUTO_CREATE_TABLES: "false"
  AUTO_SEED: "false"
  SEED_DEMO_DATA: "true"
  SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@hertex.dev}
  SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-Admin@12345}

services:
  postgres:
    image: postgres:16-alpine
    container_name: hertex_erp_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hertex_erp}
      POSTGRES_USER: ${POSTGRES_USER:-hertex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hertex_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - hertex_erp_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hertex} -d ${POSTGRES_DB:-hertex_erp}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: hertex_erp_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./backend
    container_name: hertex_erp_api
    restart: unless-stopped
    environment: *backend-env
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >-
      sh -c "alembic upgrade head && python -m app.db.seed &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)
      interval: 10s
      timeout: 5s
      retries: 12

  worker:
    build:
      context: ./backend
    container_name: hertex_erp_worker
    restart: unless-stopped
    environment: *backend-env
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >-
      celery -A app.workers.celery_app:celery_app worker
      --loglevel=info --concurrency=2

  beat:
    build:
      context: ./backend
    container_name: hertex_erp_beat
    restart: unless-stopped
    environment: *backend-env
    volumes:
      - hertex_erp_beatdata:/var/lib/celery
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >-
      celery -A app.workers.celery_app:celery_app beat
      --loglevel=info --scheduler celery.beat:PersistentScheduler
      --schedule /var/lib/celery/celerybeat-schedule

volumes:
  hertex_erp_pgdata:
  hertex_erp_beatdata:
